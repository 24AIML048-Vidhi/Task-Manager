<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Task Manager - Task Management System</title>

    <!-- Font Awesome -->
    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        rel="stylesheet"
    >

    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="style.css"
    >

    <!-- Immediate Auth Guard -->
    <script>
        if (!localStorage.getItem("token")) {
            window.location.replace("/login.html");
        }
    </script>
</head>



<body class="task-page">


    <!-- ==================================================
         Header
    ================================================== -->

    <header class="header">

        <div>

            <h1>

                <i class="fa-solid fa-list-check"></i>

                Task Management System

            </h1>

            <p>
                Manage your daily tasks easily
            </p>

        </div>


        <!-- User Section -->

        <div class="user-section">

            <div class="user-info">

                <div class="user-avatar">

                    <i class="fa-solid fa-user"></i>

                </div>

                <div>

                    <strong id="usernameDisplay">
                        User
                    </strong>

                    <small id="emailDisplay">
                        user@email.com
                    </small>

                </div>

            </div>


            <button
                class="logout-btn"
                onclick="logoutUser()"
            >

                <i class="fa-solid fa-right-from-bracket"></i>

                Logout

            </button>

        </div>

    </header>



    <!-- ==================================================
         Main Container
    ================================================== -->

    <main class="container">


        <!-- ==================================================
             Add Task Card
        ================================================== -->

        <div class="card">

            <div class="section-header">

                <div>

                    <h2>

                        <i class="fa-solid fa-plus"></i>

                        Add New Task

                    </h2>

                    <p>
                        Create a new task and select its status
                    </p>

                </div>

            </div>


            <form
                id="taskForm"
                onsubmit="addTask(event)"
            >


                <!-- Task Title -->

                <div class="form-group">

                    <label for="title">

                        Task Title

                    </label>

                    <input
                        type="text"
                        id="title"
                        placeholder="Enter task title"
                        required
                    >

                </div>


                <!-- Description -->

                <div class="form-group">

                    <label for="description">

                        Description

                    </label>

                    <textarea
                        id="description"
                        rows="3"
                        placeholder="Enter task description"
                    ></textarea>

                </div>


                <!-- Priority -->

                <div class="form-group">

                    <label for="priority">

                        Priority

                    </label>

                    <select id="priority">

                        <option value="low">
                            Low
                        </option>

                        <option
                            value="medium"
                            selected
                        >
                            Medium
                        </option>

                        <option value="high">
                            High
                        </option>

                    </select>

                </div>


                <!-- Status -->

                <div class="form-group">

                    <label>

                        Task Status

                    </label>


                    <div class="status-options">


                        <label class="status-option">

                            <input
                                type="radio"
                                name="status"
                                value="pending"
                                checked
                            >

                            <span>

                                <i
                                    class="fa-regular fa-clock"
                                ></i>

                                Pending

                            </span>

                        </label>


                        <label class="status-option">

                            <input
                                type="radio"
                                name="status"
                                value="in-progress"
                            >

                            <span>

                                <i
                                    class="fa-solid fa-spinner"
                                ></i>

                                In Progress

                            </span>

                        </label>


                        <label class="status-option">

                            <input
                                type="radio"
                                name="status"
                                value="completed"
                            >

                            <span>

                                <i
                                    class="fa-solid fa-check"
                                ></i>

                                Completed

                            </span>

                        </label>


                    </div>

                </div>


                <!-- Buttons -->

                <div class="form-actions">

                    <button
                        type="submit"
                        class="add-btn"
                        id="addTaskButton"
                    >

                        <i class="fa-solid fa-plus"></i>

                        Add Task

                    </button>


                    <button
                        type="button"
                        class="refresh-btn"
                        onclick="loadTasks()"
                    >

                        <i class="fa-solid fa-rotate"></i>

                        Refresh

                    </button>

                </div>


            </form>

        </div>



        <!-- ==================================================
             Task Status Navigation
        ================================================== -->

        <div class="card status-card">

            <div class="status-tabs">


                <!-- Pending -->

                <button
                    type="button"
                    class="status-tab active"
                    data-status="pending"
                    onclick="showStatusTasks('pending')"
                >

                    <i class="fa-regular fa-clock"></i>

                    <span>
                        Pending
                    </span>

                    <span
                        class="status-count"
                        id="pendingCount"
                    >
                        0
                    </span>

                </button>


                <!-- In Progress -->

                <button
                    type="button"
                    class="status-tab"
                    data-status="in-progress"
                    onclick="showStatusTasks('in-progress')"
                >

                    <i class="fa-solid fa-spinner"></i>

                    <span>
                        In Progress
                    </span>

                    <span
                        class="status-count"
                        id="inProgressCount"
                    >
                        0
                    </span>

                </button>


                <!-- Completed -->

                <button
                    type="button"
                    class="status-tab"
                    data-status="completed"
                    onclick="showStatusTasks('completed')"
                >

                    <i class="fa-solid fa-circle-check"></i>

                    <span>
                        Completed
                    </span>

                    <span
                        class="status-count"
                        id="completedCount"
                    >
                        0
                    </span>

                </button>

            </div>

        </div>



        <!-- ==================================================
             Task List Card
        ================================================== -->

        <div class="card table-card">


            <!-- List Header -->

            <div class="task-list-header">

                <div>

                    <h2 id="currentStatusTitle">

                        <i class="fa-regular fa-clock"></i>

                        Pending Tasks

                    </h2>

                    <p id="taskListDescription">

                        Tasks that are waiting to be started

                    </p>

                </div>


                <!-- PDF Download -->

                <button
                    type="button"
                    class="download-btn"
                    onclick="downloadCurrentStatusPDF()"
                >

                    <i class="fa-solid fa-file-pdf"></i>

                    Download PDF

                </button>

            </div>



            <!-- Task Table -->

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>
                                ID
                            </th>

                            <th>
                                Task
                            </th>

                            <th>
                                Description
                            </th>

                            <th>
                                Priority
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Created
                            </th>

                            <th>
                                Actions
                            </th>

                        </tr>

                    </thead>


                    <tbody id="taskTable">

                    </tbody>

                </table>

            </div>

        </div>



        <!-- ==================================================
             Footer
        ================================================== -->

        <footer class="footer">

            <p>

                <i class="fa-solid fa-code"></i>

                Built using Node.js, Express.js,
                MongoDB & JavaScript

            </p>

        </footer>


    </main>



    <!-- ==================================================
         JavaScript
    ================================================== -->

    <script src="task-manager.js"></script>

</body>

</html>

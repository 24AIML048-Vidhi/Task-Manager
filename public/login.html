<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Task Management System</title>

    <!-- Font Awesome -->
    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        rel="stylesheet"
    >

    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="style.css"
    >

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>



<body class="auth-page">

    <!-- ==================================================
         Header
    ================================================== -->

    <header class="header">
        <div>
            <h1>
                <i class="fa-solid fa-list-check"></i>
                Task Management System
            </h1>
            <p>
                Manage your daily tasks easily
            </p>
        </div>
    </header>

    <!-- ==================================================
         Authentication Container
    ================================================== -->

    <div class="auth-container">



        <!-- ==================================================
             Login Card
        ================================================== -->

        <div class="auth-card">


            <!-- Logo -->
            <div class="auth-logo">

                <i class="fa-solid fa-list-check"></i>

            </div>


            <!-- Heading -->

            <h1>
                Welcome Back
            </h1>


            <p class="auth-subtitle">

                Login to manage your tasks

            </p>



            <!-- ==================================================
                 Login Form
            ================================================== -->

            <form
                id="loginForm"
                onsubmit="loginUser(event)"
            >


                <!-- Email -->

                <div class="input-group">

                    <label for="email">

                        <i
                            class="fa-solid fa-envelope"
                        ></i>

                        Email

                    </label>


                    <div class="input-wrapper">

                        <i
                            class="fa-solid fa-envelope input-icon"
                        ></i>


                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>



                <!-- Password -->

                <div class="input-group">

                    <label for="password">

                        <i
                            class="fa-solid fa-lock"
                        ></i>

                        Password

                    </label>


                    <div class="input-wrapper">

                        <i
                            class="fa-solid fa-lock input-icon"
                        ></i>


                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >


                        <!-- Show Password -->

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword()"
                            aria-label="Show password"
                        >

                            <i
                                id="passwordIcon"
                                class="fa-solid fa-eye"
                            ></i>

                        </button>

                    </div>

                </div>



                <!-- Forgot Password -->

                <div class="auth-options">

                    <a
                        href="#"
                        onclick="forgotPassword(event)"
                    >

                        Forgot Password?

                    </a>

                </div>



                <!-- Error Message -->

                <div
                    id="loginError"
                    class="auth-error"
                ></div>



                <!-- Login Button -->

                <button
                    type="submit"
                    id="loginButton"
                    class="auth-button"
                >

                    <i
                        class="fa-solid fa-right-to-bracket"
                    ></i>

                    Login

                </button>


            </form>



            <!-- ==================================================
                 Divider
            ================================================== -->

            <div class="auth-divider">

                <span>OR</span>

            </div>



            <!-- ==================================================
                 Google Login
            ================================================== -->

            <div id="googleBtnContainer" style="display:flex; justify-content:center; width:100%; min-height:44px; margin-bottom: 12px;"></div>

            <button
                type="button"
                id="customGoogleBtn"
                class="google-button"
                onclick="googleLogin()"
            >
                <i class="fa-brands fa-google"></i>
                Continue with Google
            </button>




            <!-- ==================================================
                 Signup
            ================================================== -->

            <p class="auth-switch">

                Don't have an account?

                <a href="signup.html">

                    Create Account

                </a>

            </p>



            <!-- ==================================================
                 Back to Home
            ================================================== -->

            <div class="back-home">

                <a href="/">

                    <i
                        class="fa-solid fa-arrow-left"
                    ></i>

                    Back to Home

                </a>

            </div>


        </div>


        <!-- ==================================================
             Footer
        ================================================== -->

        <div class="auth-footer">

            <p>

                <i
                    class="fa-solid fa-shield-halved"
                ></i>

                Your account is securely protected

            </p>

        </div>


    </div>



    <!-- Login JavaScript -->

    <script src="login.js"></script>

</body>

</html>
